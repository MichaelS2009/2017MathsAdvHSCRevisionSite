<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HSC Maths Advanced - Study Sheets</title>
    <style>
        :root {
            --purple: #6B4C7A;
            --blue: #3B689E;
            --green: #4A7C59;
            --red: #C44536;
            --black: #2C2C2C;
            --cream: #F9F7F2;
            --white: #FFFFFF;
            --gray-light: #E8E8E8;
            --gray: #9B9B9B;
            --shadow: 0 2px 8px rgba(0,0,0,0.08);
            --radius: 8px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--cream);
            color: var(--black);
            line-height: 1.5;
            font-size: 15px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            background: var(--white);
            padding: 20px 0;
            border-bottom: 3px solid var(--purple);
            margin-bottom: 30px;
        }

        header h1 {
            color: var(--purple);
            font-size: 28px;
            font-weight: 700;
        }

        header p {
            color: var(--gray);
            font-size: 14px;
            margin-top: 5px;
        }

        .nav-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .nav-tab {
            padding: 10px 20px;
            background: var(--white);
            border: 2px solid var(--gray-light);
            border-radius: var(--radius);
            cursor: pointer;
            font-weight: 600;
            color: var(--gray);
            transition: all 0.2s;
        }

        .nav-tab:hover {
            border-color: var(--purple);
            color: var(--purple);
        }

        .nav-tab.active {
            background: var(--purple);
            color: var(--white);
            border-color: var(--purple);
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
            align-items: center;
        }

        .search-box {
            flex: 1;
            min-width: 250px;
            padding: 10px 15px;
            border: 2px solid var(--gray-light);
            border-radius: var(--radius);
            font-size: 15px;
        }

        .search-box:focus {
            outline: none;
            border-color: var(--purple);
        }

        .filter-select {
            padding: 10px 15px;
            border: 2px solid var(--gray-light);
            border-radius: var(--radius);
            font-size: 14px;
            background: var(--white);
            cursor: pointer;
        }

        .filter-select:focus {
            outline: none;
            border-color: var(--purple);
        }

        .modules-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }

        .module-card {
            background: var(--white);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: var(--shadow);
            border-left: 5px solid var(--blue);
            transition: transform 0.2s;
        }

        .module-card:hover {
            transform: translateY(-3px);
        }

        .module-card h3 {
            color: var(--purple);
            font-size: 18px;
            margin-bottom: 8px;
        }

        .module-card .subject {
            color: var(--gray);
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
        }

        .module-card .meta {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: var(--gray);
            margin-bottom: 15px;
        }

        .module-card .status {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .status.not-started {
            background: var(--gray-light);
            color: var(--gray);
        }

        .status.in-progress {
            background: #FEF3C7;
            color: #92400E;
        }

        .status.completed {
            background: #D1FAE5;
            color: #065F46;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: var(--radius);
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.2s;
        }

        .btn-primary {
            background: var(--purple);
            color: var(--white);
        }

        .btn-primary:hover {
            background: #5A3F6A;
        }

        .btn-secondary {
            background: var(--gray-light);
            color: var(--black);
        }

        .btn-secondary:hover {
            background: var(--gray);
            color: var(--white);
        }

        .study-sheet {
            background: var(--white);
            border-radius: var(--radius);
            padding: 30px;
            box-shadow: var(--shadow);
            max-width: 1000px;
            margin: 0 auto;
        }

        .study-sheet h2 {
            color: var(--purple);
            font-size: 24px;
            margin-bottom: 20px;
            border-bottom: 3px solid var(--purple);
            padding-bottom: 10px;
        }

        .sheet-section {
            margin-bottom: 25px;
            border: 2px solid var(--gray-light);
            border-radius: var(--radius);
            overflow: hidden;
        }

        .sheet-section-header {
            background: var(--purple);
            color: var(--white);
            padding: 12px 20px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
        }

        .sheet-section-header:hover {
            background: #5A3F6A;
        }

        .sheet-section-content {
            padding: 20px;
            background: var(--cream);
        }

        .sheet-section-content.hidden {
            display: none;
        }

        .section-core .sheet-section-header { background: var(--purple); }
        .section-formula .sheet-section-header { background: var(--blue); }
        .section-draw .sheet-section-header { background: var(--green); }
        .section-practical .sheet-section-header { background: var(--green); }
        .section-traps .sheet-section-header { background: var(--red); }
        .section-know .sheet-section-header { background: var(--gray); }

        .content-list {
            list-style: none;
        }

        .content-list li {
            padding: 8px 0;
            border-bottom: 1px solid var(--gray-light);
            font-size: 14px;
        }

        .content-list li:last-child {
            border-bottom: none;
        }

        .content-list li strong {
            color: var(--purple);
        }

        .formula-box {
            background: var(--white);
            border: 2px solid var(--blue);
            border-radius: var(--radius);
            padding: 15px;
            margin: 10px 0;
            font-family: 'Courier New', monospace;
            font-size: 14px;
        }

        .formula {
            color: var(--blue);
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 15px;
        }

        .formula-def {
            color: var(--gray);
            font-size: 13px;
            margin-left: 20px;
        }

        .diagram-card {
            background: var(--white);
            border: 2px solid var(--green);
            border-radius: var(--radius);
            padding: 15px;
            margin: 10px 0;
        }

        .diagram-card h4 {
            color: var(--green);
            margin-bottom: 8px;
            font-size: 15px;
        }

        .diagram-card ul {
            margin-left: 20px;
            font-size: 13px;
            color: var(--gray);
        }

        .trap-item {
            background: #FEF2F2;
            border-left: 4px solid var(--red);
            padding: 10px 15px;
            margin: 8px 0;
            font-size: 14px;
        }

        .star {
            color: #F59E0B;
            font-weight: 700;
        }

        .personalisation {
            background: var(--white);
            padding: 20px;
            border-radius: var(--radius);
            margin-bottom: 25px;
            box-shadow: var(--shadow);
        }

        .personalisation h3 {
            color: var(--purple);
            margin-bottom: 15px;
            font-size: 18px;
        }

        .control-group {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            align-items: center;
            margin-bottom: 10px;
        }

        .control-group label {
            font-weight: 600;
            color: var(--gray);
            font-size: 14px;
        }

        .control-group select,
        .control-group input[type="checkbox"] {
            cursor: pointer;
        }

        .study-mode .container {
            max-width: 900px;
        }

        .study-mode header,
        .study-mode .nav-tabs,
        .study-mode .controls,
        .study-mode .personalisation {
            display: none;
        }

        .study-mode .study-sheet {
            box-shadow: none;
            padding: 0;
        }

        .checkbox-item {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 8px 0;
        }

        .checkbox-item input[type="checkbox"] {
            margin-top: 3px;
            cursor: pointer;
        }

        @media print {
            body {
                background: white;
                font-size: 11px;
            }

            .container {
                max-width: 100%;
                padding: 0;
            }

            header, .nav-tabs, .controls, .personalisation, .btn {
                display: none !important;
            }

            .study-sheet {
                box-shadow: none;
                padding: 0;
                max-width: 100%;
            }

            .sheet-section {
                break-inside: avoid;
                border: 1px solid #000;
                margin-bottom: 10px;
            }

            .sheet-section-header {
                background: #f0f0f0 !important;
                color: #000 !important;
                padding: 8px;
                font-size: 12px;
            }

            .sheet-section-content {
                padding: 10px;
                background: white;
            }

            .formula-box, .diagram-card {
                border: 1px solid #000;
            }
        }

        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }

            .modules-grid {
                grid-template-columns: 1fr;
            }

            .controls {
                flex-direction: column;
                align-items: stretch;
            }

            .search-box {
                min-width: 100%;
            }

            .control-group {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }
        }

        .hidden {
            display: none !important;
        }

        .text-purple { color: var(--purple); }
        .text-blue { color: var(--blue); }
        .text-green { color: var(--green); }
        .text-red { color: var(--red); }

        .back-btn {
            margin-bottom: 20px;
        }

        .coverage-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        .coverage-table th,
        .coverage-table td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid var(--gray-light);
            font-size: 14px;
        }

        .coverage-table th {
            background: var(--purple);
            color: var(--white);
            font-weight: 600;
        }

        .coverage-table tr:hover {
            background: var(--cream);
        }

        .coverage-status {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 600;
        }

        .coverage-status.covered {
            background: #D1FAE5;
            color: #065F46;
        }

        .coverage-status.partial {
            background: #FEF3C7;
            color: #92400E;
        }

        .coverage-status.revision {
            background: var(--gray-light);
            color: var(--gray);
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <h1>📚 HSC Mathematics Advanced</h1>
            <p>NSW Stage 6 — Year 11 Study Sheets</p>
        </div>
    </header>

    <div class="container">
        <div class="nav-tabs">
            <div class="nav-tab active" data-tab="dashboard">Dashboard</div>
            <div class="nav-tab" data-tab="syllabus">Syllabus Coverage</div>
        </div>

        <div id="dashboard-tab">
            <div class="controls">
                <input type="text" class="search-box" id="search-modules" placeholder="Search modules...">
                <select class="filter-select" id="filter-subject">
                    <option value="">All Subjects</option>
                    <option value="Mathematics Advanced">Mathematics Advanced</option>
                </select>
                <select class="filter-select" id="filter-status">
                    <option value="">All Status</option>
                    <option value="not-started">Not Started</option>
                    <option value="in-progress">In Progress</option>
                    <option value="completed">Completed</option>
                </select>
            </div>

            <div class="modules-grid" id="modules-grid"></div>
        </div>

        <div id="syllabus-tab" class="hidden">
            <div class="study-sheet">
                <h2>Syllabus Coverage</h2>
                <div id="syllabus-coverage-content">
                    <p style="color: var(--gray);">Select a module from the Dashboard to view syllabus coverage.</p>
                </div>
            </div>
        </div>

        <div id="study-sheet-view" class="hidden">
            <button class="btn btn-secondary back-btn" onclick="backToDashboard()">← Back to Dashboard</button>

            <div class="personalisation">
                <h3>Personalisation</h3>
                <div class="control-group">
                    <label>Page Format:</label>
                    <select id="page-format">
                        <option value="a4-single">A4 Single-sided</option>
                        <option value="a4-double">A4 Double-sided</option>
                        <option value="a3-single">A3 Single-sided</option>
                    </select>
                </div>
                <div class="control-group">
                    <label>Detail Level:</label>
                    <select id="detail-level">
                        <option value="ultra-compact">Ultra-compact</option>
                        <option value="standard" selected>Standard one-page</option>
                        <option value="expanded">Expanded revision</option>
                    </select>
                </div>
                <div class="control-group">
                    <label>
                        <input type="checkbox" id="high-priority-only"> Show ★ high-priority only
                    </label>
                    <label>
                        <input type="checkbox" id="hide-explanations"> Hide explanations (active recall)
                    </label>
                    <label>
                        <input type="checkbox" id="show-checkboxes"> Show checkboxes (study mode)
                    </label>
                </div>
                <div class="control-group" style="margin-top: 10px;">
                    <button class="btn btn-primary" onclick="window.print()">🖨️ Print / Export</button>
                </div>
            </div>

            <div class="study-sheet" id="study-sheet-content"></div>
        </div>
    </div>

    <script>
        const modulesData = [{"id": 0, "subject": "Mathematics Advanced", "number": "F1", "title": "Working with Functions", "year": "Year 11", "dotPoints": 28, "status": "not-started", "coreIdeas": [{"text": "Function: set of ordered pairs (x,y) where no two pairs have same x-component (one-to-one or many-to-one)", "star": true}, {"text": "Relation: any set of ordered pairs (x,y); can be one-to-one, one-to-many, many-to-one, many-to-many", "star": true}, {"text": "Vertical line test: if any vertical line cuts graph more than once, it's not a function", "star": true}, {"text": "Domain: set of all possible x-values; Range: set of all possible y-values", "star": true}, {"text": "Interval notation: [a,b] includes endpoints; (a,b) excludes; [a,\u221e) from a to infinity", "star": true}, {"text": "Independent variable (x) vs dependent variable (y = f(x))", "star": false}, {"text": "f(x) = 0 finds x-intercepts; f(x) = k finds where graph cuts line y = k", "star": true}, {"text": "Even function: f(\u2212x) = f(x), symmetric about y-axis; Odd function: f(\u2212x) = \u2212f(x), 180\u00b0 rotational symmetry", "star": true}, {"text": "Composite function: f(g(x)) \u2014 apply g first, then f; domain restricted by both functions", "star": true}, {"text": "Sum/difference/product/quotient of functions: combine algebraically, domain is intersection", "star": false}, {"text": "Linear: f(x) = mx + c; m = gradient, c = y-intercept", "star": true}, {"text": "Quadratic: parabolic shape; vertex form y = a(x\u2212h)\u00b2 + k; turning point at (h,k)", "star": true}, {"text": "Discriminant \u0394 = b\u00b2\u22124ac: \u0394>0 two x-intercepts; \u0394=0 one (touches); \u0394<0 none", "star": true}, {"text": "Cubic forms: kx\u00b3 (origin); k(x\u2212b)\u00b3+c (translated); k(x\u2212a)(x\u2212b)(x\u2212c) (three x-intercepts)", "star": true}, {"text": "Inverse variation: f(x) = k/x \u2014 hyperbolic shape with asymptotes x=0, y=0", "star": true}, {"text": "Absolute value: |x| = distance from         let modules = [];
        let currentModule = null;

        function loadSavedData() {
            const saved = localStorage.getItem('hsc-modules');
            if (saved) {
                const savedModules = JSON.parse(saved);
                modules = modulesData.map((m, i) => {
                    const saved = savedModules.find(s => s.number === m.number);
                    return saved ? {...m, status: saved.status} : m;
                });
            } else {
                modules = modulesData;
            }

            const savedPrefs = localStorage.getItem('hsc-preferences');
            if (savedPrefs) {
                const prefs = JSON.parse(savedPrefs);
                document.getElementById('page-format').value = prefs.pageFormat || 'a4-single';
                document.getElementById('detail-level').value = prefs.detailLevel || 'standard';
                document.getElementById('high-priority-only').checked = prefs.highPriorityOnly || false;
                document.getElementById('hide-explanations').checked = prefs.hideExplanations || false;
                document.getElementById('show-checkboxes').checked = prefs.showCheckboxes || false;
            }
        }

        function saveData() {
            localStorage.setItem('hsc-modules', JSON.stringify(modules));
        }

        function savePreferences() {
            const prefs = {
                pageFormat: document.getElementById('page-format').value,
                detailLevel: document.getElementById('detail-level').value,
                highPriorityOnly: document.getElementById('high-priority-only').checked,
                hideExplanations: document.getElementById('hide-explanations').checked,
                showCheckboxes: document.getElementById('show-checkboxes').checked
            };
            localStorage.setItem('hsc-preferences', JSON.stringify(prefs));
        }

        function renderModules() {
            const grid = document.getElementById('modules-grid');
            const searchTerm = document.getElementById('search-modules').value.toLowerCase();
            const subjectFilter = document.getElementById('filter-subject').value;
            const statusFilter = document.getElementById('filter-status').value;

            grid.innerHTML = '';

            const filtered = modules.filter(m => {
                const matchesSearch = m.title.toLowerCase().includes(searchTerm) || 
                                     m.subject.toLowerCase().includes(searchTerm);
                const matchesSubject = !subjectFilter || m.subject === subjectFilter;
                const matchesStatus = !statusFilter || m.status === statusFilter;
                return matchesSearch && matchesSubject && matchesStatus;
            });

            if (filtered.length === 0) {
                grid.innerHTML = '<p style="color: var(--gray); grid-column: 1/-1;">No modules found.</p>';
                return;
            }

            filtered.forEach((module, index) => {
                const realIndex = modules.findIndex(m => m.number === module.number);
                const card = document.createElement('div');
                card.className = 'module-card';
                card.innerHTML = `
                    <div class="subject">${module.subject}</div>
                    <h3>Module ${module.number}: ${module.title}</h3>
                    <div class="meta">
                        <span>${module.dotPoints} dot points</span>
                        <span>${module.year}</span>
                    </div>
                    <span class="status ${module.status}">${module.status.replace('-', ' ').toUpperCase()}</span>
                    <button class="btn btn-primary" onclick="openModule(${realIndex})">Study Sheet</button>
                `;
                grid.appendChild(card);
            });
        }

        function openModule(index) {
            currentModule = modules[index];

            document.getElementById('dashboard-tab').classList.add('hidden');
            document.getElementById('syllabus-tab').classList.add('hidden');
            document.getElementById('study-sheet-view').classList.remove('hidden');

            renderStudySheet(currentModule);
            renderSyllabusCoverage(currentModule);

            if (currentModule.status === 'not-started') {
                currentModule.status = 'in-progress';
                saveData();
                renderModules();
            }
        }

        function backToDashboard() {
            document.getElementById('study-sheet-view').classList.add('hidden');
            document.getElementById('dashboard-tab').classList.remove('hidden');
            currentModule = null;
        }

                    <div class="sheet-section-header" onclick="toggleSection(this)">
                        <span>🔬 Practicals</span>
                        <span>▼</span>
                    </div>
                    <div class="sheet-section-content">
                        ${module.practicals.map(practical => `
                            <div class="diagram-card">
                                <h4>${checkboxHtml}${practical.aim}</h4>
                                <ul>
                                    <li><strong>IV:</strong> ${practical.iv} | <strong>DV:</strong> ${practical.dv}</li>
                                    <li><strong>Controls:</strong> ${practical.controls}</li>
                                    <li><strong>Graph:</strong> ${practical.graph}</li>
                                    <li><strong>Limitations:</strong> ${practical.limitations}</li>
                                    ${practical.improvement ? `<li><strong>Improvement:</strong> ${practical.improvement}</li>` : ''}
                                </ul>
                            </div>
                        `).join('')}
                    </div>
                </div>

                <div class="sheet-section section-traps">
                    <div class="sheet-section-header" onclick="toggleSection(this)">
                        <span>⚠️ Exam Traps</span>
                        <span>▼</span>
                    </div>
                    <div class="sheet-section-content">
                        ${module.traps.map(trap => `
                            <div class="trap-item">${checkboxHtml}${trap}</div>
                        `).join('')}
                    </div>
                </div>

                ${module.knowButDontWrite.length > 0 ? `
                <div class="sheet-section section-know">
                    <div class="sheet-section-header" onclick="toggleSection(this)">
                        <span>📝 Know but Don't Write</span>
                        <span>▼</span>
                    </div>
                    <div class="sheet-section-content">
                        <ul class="content-list">
                            ${module.knowButDontWrite.map(item => `
                                <li>${checkboxHtml}${item}</li>
                            `).join('')}
                        </ul>
                    </div>
                </div>
                ` : ''}
            `;

            if (hideExplanations) {
                document.querySelectorAll('.formula-def').forEach(el => el.classList.add('hidden'));
                document.querySelectorAll('.diagram-card ul').forEach(el => el.classList.add('hidden'));
                document.querySelectorAll('.trap-item').forEach(el => {
                    el.innerHTML = el.innerHTML.replace(/<input.*?>/g, '<input type="checkbox" style="margin-right: 8px;"> ');
                });
            }
        }

        function renderSyllabusCoverage(module) {
            const content = document.getElementById('syllabus-coverage-content');

            content.innerHTML = `
                <h3 style="color: var(--purple); margin-bottom: 10px;">${module.subject} — Module ${module.number}: ${module.title}</h3>
                <table class="coverage-table">
                    <thead>
                        <tr>
                            <th>Syllabus Dot Point</th>
                            <th>Coverage Status</th>
                            <th>Section</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${module.syllabusPoints.map(point => `
                            <tr>
                                <td>${point.text}</td>
                                <td><span class="coverage-status ${point.status}">${point.status}</span></td>
                                <td>${point.section}</td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
        }

        function toggleSection(header) {
            const content = header.nextElementSibling;
            content.classList.toggle('hidden');
            header.querySelector('span:last-child').textContent = content.classList.contains('hidden') ? '▶' : '▼';
        }

        document.querySelectorAll('.nav-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');

                const tabName = tab.dataset.tab;
                document.getElementById('dashboard-tab').classList.add('hidden');
                document.getElementById('syllabus-tab').classList.add('hidden');

                if (tabName === 'dashboard') {
                    document.getElementById('dashboard-tab').classList.remove('hidden');
                } else if (tabName === 'syllabus') {
                    document.getElementById('syllabus-tab').classList.remove('hidden');
                }
            });
        });

        document.getElementById('search-modules').addEventListener('input', renderModules);
        document.getElementById('filter-subject').addEventListener('change', renderModules);
        document.getElementById('filter-status').addEventListener('change', renderModules);

        document.getElementById('page-format').addEventListener('change', savePreferences);
        document.getElementById('detail-level').addEventListener('change', () => {
            savePreferences();
            if (currentModule) renderStudySheet(currentModule);
        });
        document.getElementById('high-priority-only').addEventListener('change', () => {
            savePreferences();
            if (currentModule) renderStudySheet(currentModule);
        });
        document.getElementById('hide-explanations').addEventListener('change', () => {
            savePreferences();
            if (currentModule) renderStudySheet(currentModule);
        });
        document.getElementById('show-checkboxes').addEventListener('change', () => {
            savePreferences();
            if (currentModule) renderStudySheet(currentModule);
        });

        loadSavedData();
        renderModules();
    </script>
</body>
</html>
