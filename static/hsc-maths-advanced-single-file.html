od \u03c0/a", "Phase shift = \u2212b; midline y=c; sin/cos range [c\u2212|k|,c+|k|]", "Solve every solution in the given domain; model periodic phenomena"], "formulas": ["Amplitude=|k|", "Period sin/cos=2\u03c0/a; tan=\u03c0/a"], "draw": ["Key labelled graph(s) for this module: axes, domain, intercepts/asymptotes or key parameters", "One exam-relevant representation showing the main relationship"], "traps": ["State restrictions/domain conditions", "Use radians where calculus or sector formulae require them", "Give every valid solution within the stated domain"]}, {"number": "C2", "title": "Differential Calculus", "year": "Year 12", "dotPoints": 15, "core": ["\u2605 (sin x)\u2032=cos x; (cos x)\u2032=\u2212sin x; (tan x)\u2032=sec\u00b2x", "(a\u02e3)\u2032=(ln a)a\u02e3; (ln x)\u2032=1/x; (log\u2090x)\u2032=1/(x ln a)", "Chain: [e^(f(x))]\u2032=f\u2032e^f; [ln f]\u2032=f\u2032/f", "Use product, quotient and chain rules; simplify logarithms first"], "formulas": ["(sin x)\u2032=cos x; (cos x)\u2032=\u2212sin x", "(a\u02e3)\u2032=(ln a)a\u02e3", "(ln x)\u2032=1/x"], "draw": ["Key labelled graph(s) for this module: axes, domain, intercepts/asymptotes or key parameters", "One exam-relevant representation showing the main relationship"], "traps": ["State restrictions/domain conditions", "Use radians where calculus or sector formulae require them", "Give every valid solution within the stated domain"]}, {"number": "C3", "title": "Applications of Differentiation", "year": "Year 12", "dotPoints": 14, "core": ["\u2605 f\u2032 sign gives increasing/decreasing; f\u2032=0 gives stationary candidates", "f\u2033>0 concave up; f\u2033<0 concave down", "At stationary: f\u2033>0 local min; f\u2033<0 local max", "Optimisation: define variable/function \u2192 differentiate \u2192 classify \u2192 check endpoints/constraints"], "formulas": ["f\u2032(x)=0", "f\u2033(x)>0 min; f\u2033(x)<0 max"], "draw": ["Key labelled graph(s) for this module: axes, domain, intercepts/asymptotes or key parameters", "One exam-relevant representation showing the main relationship"], "traps": ["State restrictions/domain conditions", "Use radians where calculus or sector formulae require them", "Give every valid solution within the stated domain"]}, {"number": "C4", "title": "Integral Calculus", "year": "Year 12", "dotPoints": 25, "core": ["\u2605 \u222bx\u207fdx=x\u207f\u207a\u00b9/(n+1)+c, n\u2260\u22121; \u222b1/x dx=ln|x|+c", "\u222b\u2090\u1d47f(x)dx=F(b)\u2212F(a); definite integrals are signed areas", "Area between curves = \u222b(top\u2212bottom)dx; split at crossings", "Trapezoidal rule estimates area; total change = \u222b rate"], "formulas": ["\u222bx\u207fdx=x\u207f\u207a\u00b9/(n+1)+c", "\u222b\u2090\u1d47f(x)dx=F(b)\u2212F(a)", "\u222bsin(ax+b)dx=\u2212cos(ax+b)/a"], "draw": ["Key labelled graph(s) for this module: axes, domain, intercepts/asymptotes or key parameters", "One exam-relevant representation showing the main relationship"], "traps": ["State restrictions/domain conditions", "Use radians where calculus or sector formulae require them", "Give every valid solution within the stated domain"]}, {"number": "M1", "title": "Modelling Financial Situations", "year": "Year 12", "dotPoints": 16, "core": ["\u2605 Compound interest: A=P(1+r)\u207f; align rate and number of periods", "Arithmetic: T\u2099=a+(n\u22121)d; geometric: T\u2099=ar\u207f\u207b\u00b9", "S\u2099 geometric = a(1\u2212r\u207f)/(1\u2212r); limiting S=a/(1\u2212r), |r|<1", "Annuities use regular contributions/withdrawals and compound interest"], "formulas": ["A=P(1+r)\u207f", "T\u2099=a+(n\u22121)d; T\u2099=ar\u207f\u207b\u00b9", "S\u2099=a(1\u2212r\u207f)/(1\u2212r)"], "draw": ["Key labelled graph(s) for this module: axes, domain, intercepts/asymptotes or key parameters", "One exam-relevant representation showing the main relationship"], "traps": ["State restrictions/domain conditions", "Use radians where calculus or sector formulae require them", "Give every valid solution within the state
